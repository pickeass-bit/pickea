<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pick!t — Picks de fútbol</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  :root{
    --bg: #050505;
    --card: #0D0E10;
    --active: #131418;
    --line: #25262B;
    --purple: #7C3AED;
    --purple-bright: #8B3DFF;
    --purple-deep: #38106B;
    --text: #FFFFFF;
    --text-dim: #9B9BA3;
    --accent: #B9FF42;   /* verde lima de marca */
    --win: #22C55E;
    --win-soft: #4ADE80;
    --loss: #F43F5E;
    --loss-soft: #FB7185;
    --pending: #FACC15;
    --la-liga-red: #E2231A;
    --radius: 18px;
    --radius-lg: 24px;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--bg);
    color: var(--text);
    font-family:'Montserrat', -apple-system, sans-serif;
    min-height:100vh;
    line-height:1.45;
    font-weight:400;
  }
  .wrap{ max-width:880px; margin:0 auto; padding:0 0 64px; }
  a{ color:inherit; }
  button{ font-family:inherit; }
  button:focus-visible, .tab:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

  /* ---------- Hero ---------- */
  .hero{
    position:relative;
    background:
      radial-gradient(115% 150% at 6% 0%, #8B3DFF 0%, #4C1698 20%, #1B0740 42%, transparent 66%),
      var(--bg);
    padding:28px 20px 24px;
  }
  .hero-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:18px; flex-wrap:wrap; }
  .brand{ font-weight:800; font-style:italic; font-size:clamp(32px, 8vw, 46px); letter-spacing:-0.02em; line-height:1; margin:0; color:#FFFFFF; }
  .bang{ font-size:1.1em; font-weight:900; }
  .brand .bang{ color:var(--accent); }
  .hero-stats{ display:flex; gap:30px; flex-wrap:wrap; }
  .stat-block{ text-align:center; }
  .stat-num{ font-weight:800; font-size:clamp(24px,6vw,34px); color:var(--text); line-height:1; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .stat-label{ color:var(--text-dim); font-size:11px; font-weight:700; letter-spacing:.05em; margin-top:6px; text-transform:uppercase; }

  /* ---------- Tabs (píldora) ---------- */
  .body-pad{ padding:20px 20px 0; }
  .tabs{ display:flex; gap:10px; flex-wrap:wrap; row-gap:10px; align-items:center; }
  .tab{
    background:none; border:1.5px solid transparent; border-radius:999px; cursor:pointer;
    font-weight:800; font-size:13px; letter-spacing:.02em; text-transform:uppercase;
    color:var(--text-dim); padding:8px 16px;
  }
  .tab.active{ color:#FFFFFF; border-color:var(--accent); box-shadow:0 0 14px -3px rgba(185,255,66,.6); }
  .tab:hover{ color:#FFFFFF; }
  .tab.tab-divider{ margin-left:8px; }

  /* ---------- Section headings ---------- */
  .section-heading{ text-align:center; font-weight:800; font-style:italic; font-size:clamp(34px,9.5vw,54px); letter-spacing:-0.02em; line-height:1; margin:22px 0 4px; }
  .section-heading .bang{ color:var(--accent); }
  .section-subheading{ text-align:center; color:var(--text-dim); font-weight:700; letter-spacing:.25em; text-transform:uppercase; font-size:12px; font-style:italic; margin:0 0 18px; }

  /* ---------- Status states ---------- */
  .status-card{ margin-top:22px; border:1px dashed var(--line); border-radius:var(--radius); padding:22px; color:var(--text-dim); font-size:14px; }
  .status-card.error{ border-color:rgba(244,63,94,.45); color:#F6C6CE; background:rgba(244,63,94,.06); }
  .status-card code{ display:block; margin-top:10px; padding:8px 10px; background:var(--bg); border-radius:6px; color:var(--purple-bright); font-size:12px; word-break:break-all; }
  .status-card button{ margin-top:14px; background:var(--purple); color:#F5F5F5; border:none; padding:9px 16px; border-radius:8px; font-weight:700; cursor:pointer; font-size:13px; }
  .skeleton{ margin-top:22px; display:flex; flex-direction:column; gap:12px; }
  .skeleton .bar{ height:100px; border-radius:var(--radius-lg); background:linear-gradient(90deg, var(--card) 25%, var(--active) 37%, var(--card) 63%); background-size:400% 100%; }
  @media (prefers-reduced-motion:no-preference){ .skeleton .bar{ animation:shimmer 1.4s ease infinite; } @keyframes shimmer{ 0%{background-position:100% 0;} 100%{background-position:0 0;} } }
  .empty{ text-align:center; color:var(--text-dim); padding:36px 20px; border:1px dashed var(--line); border-radius:var(--radius); margin-top:18px; font-weight:500; }

  /* ---------- Pick del día (portada, solo tab Todo) ---------- */
  .pick-of-day{ margin-top:16px; border:1px solid var(--line); border-radius:var(--radius-lg); background:var(--card); padding:22px 20px; box-shadow:0 0 60px -20px rgba(185,255,66,.45), 0 0 90px -30px rgba(139,61,255,.35); }
  .pod-liga{ color:var(--text-dim); font-weight:700; font-size:11.5px; text-transform:uppercase; letter-spacing:.06em; }
  .pod-teams{ display:flex; align-items:center; justify-content:center; gap:10px; font-weight:800; font-size:clamp(18px,5vw,24px); text-transform:uppercase; color:#fff; margin:16px 0; flex-wrap:wrap; text-align:center; }
  .pod-featured{ display:flex; align-items:center; justify-content:space-between; gap:14px; border:1.5px solid var(--accent); border-radius:16px; padding:14px 18px; flex-wrap:wrap; box-shadow:0 0 22px -4px rgba(185,255,66,.55); }
  .pod-pick-text{ font-weight:800; font-size:14.5px; text-transform:uppercase; color:#fff; }
  .pod-pct{ font-weight:800; font-size:19px; color:var(--accent); flex-shrink:0; font-variant-numeric:tabular-nums; }
  .cta-btn{ display:block; width:100%; text-align:center; margin-top:16px; background:linear-gradient(135deg, var(--purple-deep), var(--purple-bright)); color:#fff; font-weight:800; padding:14px; border-radius:14px; border:none; cursor:pointer; font-size:13.5px; letter-spacing:.04em; text-transform:uppercase; }

  /* ---------- Dots de color por equipo ---------- */
  .market-dot{ width:15px; height:15px; border-radius:50%; flex-shrink:0; }
  .market-dot-pair{ position:relative; width:20px; height:15px; flex-shrink:0; }
  .market-dot-pair span{ position:absolute; width:13px; height:13px; border-radius:50%; top:1px; box-shadow:0 0 0 2px var(--card); }
  .market-dot-pair span:first-child{ left:0; }
  .market-dot-pair span:last-child{ left:7px; }

  /* ---------- Partido: encabezado + tarjetas de mercado ---------- */
  .match-section{ margin-top:28px; }
  .match-head-line{ display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; font-weight:800; font-size:15px; text-transform:uppercase; color:#fff; }
  .match-head-date{ font-weight:600; color:var(--text-dim); font-size:12px; text-transform:none; letter-spacing:0; }
  .match-head-liga{ color:var(--text-dim); font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; margin-top:2px; }

  .market-row{ display:flex; gap:12px; overflow-x:auto; padding:12px 2px 6px; margin:0 -2px; -webkit-overflow-scrolling:touch; scrollbar-width:thin; }
  .market-row::-webkit-scrollbar{ height:6px; }
  .market-row::-webkit-scrollbar-thumb{ background:var(--line); border-radius:999px; }
  .market-card{ flex:0 0 auto; width:230px; background:var(--card); border:1.5px solid var(--line); border-radius:18px; padding:14px 16px; }
  .market-card.featured{ border-color:var(--accent); box-shadow:0 0 18px -5px rgba(185,255,66,.5); }
  .market-top{ display:flex; align-items:flex-start; gap:9px; }
  .market-title{ font-weight:800; font-size:13px; text-transform:uppercase; color:#fff; line-height:1.3; }
  .market-meta{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:12px; }
  .market-pct{ font-weight:800; font-size:16px; font-variant-numeric:tabular-nums; }
  .market-result{ width:22px; height:22px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; flex-shrink:0; }
  .market-result svg{ width:12px; height:12px; }
  .market-result.win{ background:rgba(34,197,94,.24); color:var(--win-soft); }
  .market-result.loss{ background:rgba(244,63,94,.24); color:var(--loss-soft); }
  .market-result.pending{ background:rgba(250,204,21,.2); color:var(--pending); }

  /* ---------- Aciertos ---------- */
  .aciertos-panel{ margin-top:8px; display:flex; flex-direction:column; gap:16px; }
  .acierto-row{ border:1px solid var(--line); border-radius:var(--radius); background:var(--card); padding:16px 18px; }
  .acierto-top{ display:flex; justify-content:space-between; align-items:baseline; gap:10px; margin-bottom:10px; }
  .acierto-label{ font-weight:800; font-size:13px; text-transform:uppercase; letter-spacing:.03em; color:#FFFFFF; }
  .acierto-pct{ font-weight:800; font-size:19px; color:var(--accent); font-variant-numeric:tabular-nums; }
  .acierto-track{ height:8px; border-radius:999px; background:var(--active); overflow:hidden; }
  .acierto-fill{ height:100%; border-radius:999px; background:linear-gradient(90deg, var(--purple-deep), var(--accent)); transition:width .5s ease; }
  .acierto-count{ margin-top:8px; font-size:11.5px; color:var(--text-dim); font-weight:600; }

  @media (max-width:520px){
    .hero-stats{ gap:22px; }
    .stat-block{ text-align:left; }
  }
</style>

<div class="wrap">

  <div class="hero">
    <div class="hero-top">
      <h1 class="brand">PICK<span class="bang">!</span>T</h1>
      <div class="hero-stats" id="heroStats">
        <div class="stat-block">
          <div class="stat-num">—</div>
          <div class="stat-label">Acierto</div>
        </div>
        <div class="stat-block">

  <div class="body-pad">
    <nav class="tabs" id="tabs"></nav>

<script>
/* ============ CONFIG ============
   Apunta esto a tu hoja publicada como CSV.
   Si no carga, ve a tu Google Sheet > Archivo > Compartir > Publicar en la web,
   elige la pestaña PICKS, formato CSV, y pega ese link aquí abajo. */
const SHEET_TAB = 'PICKS';
const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRD6SH7kGef5yS3usm1f3PqaSDxbGDpZm2MHeKOrT1IJa8qpGG_DU_TOMdGNy-7rA/pub?gid=1249050867&single=true&output=csv';
const REFRESH_MS = 5 * 60 * 1000; // auto-refresh cada 5 min
const DIAS_VISIBLE_PASADO = 7;    // cuántos días después del partido sigue viéndose
const DURACION_PARTIDO_MIN = 120; // minutos asumidos que dura un partido

/* ---- CONTEO HISTÓRICO GUARDADO AQUÍ ----
   Estos números se SUMAN a lo que venga de la hoja, para que el récord no
   se reinicie al estrenar hoja nueva. Pon aquí los ganados/perdidos que ya
   tenías antes y que ya no están en la hoja actual.
   Si algún día dejas la hoja con todo el historial, pon todo en 0. */
const BASE_RECORD = { ganadas: 149, perdidas: 61 };

// Igual que arriba, pero para la pestaña "Aciertos" (por categoría).
// No se sabe el número exacto de picks por categoría, solo el %. Se asume
// un histórico de 100 picks decididos por categoría para que el % de
// arranque sea exacto; los picks nuevos de la hoja lo van moviendo.
const BASE_ACIERTOS = {
  'Ganador':           { ganadas: 66, perdidas: 34 },
  'Goles totales':     { ganadas: 79, perdidas: 21 },
  'Tiros de esquina':  { ganadas: 66, perdidas: 34 },
  'Ambos anotan':      { ganadas: 60, perdidas: 40 }
};
/* ================================= */

const contentEl = document.getElementById('content');
const tabsEl = document.getElementById('tabs');
const heroStats = document.getElementById('heroStats').children;

let currentFilter = 'TODO'; // 'TODO' | nombre de liga | 'PASADOS' | 'ACIERTOS'
let lastRows = [];
let lastMatches = [];

function norm(s){ return (s||'').toString().trim().toLowerCase(); }
function stripAccents(s){ return (s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,''); }

function mapRow(raw){
  const out = {};
  for(const key in raw){
    const k = norm(key);
    if(k === 'fecha') out.fecha = raw[key];
    else if(k === 'hora') out.hora = raw[key];
    else if(k === 'liga') out.liga = raw[key];
    else if(k.includes('logo') && k.includes('liga')) out.logoLiga = raw[key];
    else if(k === 'local') out.local = raw[key];
    else if(k.includes('logo') && k.includes('local')) out.logoLocal = raw[key];
    else if(k.includes('color') && k.includes('local')) out.colorLocal = raw[key];
    else if(k === 'visitante') out.visitante = raw[key];
    else if(k.includes('logo') && k.includes('visit')) out.logoVisitante = raw[key];
    else if(k.includes('color') && k.includes('visit')) out.colorVisitante = raw[key];
    else if(k === 'pick') out.pick = raw[key];
    else if(k === 'confianza') out.confianza = raw[key];
    else if(k === 'resultado') out.resultado = raw[key];
    else if(k === 'tipo' || k === 'mercado' || k === 'categoria') out.tipo = raw[key];
  }
  return out;
}

function parseFecha(str){
  if(!str) return null;
  const s = String(str).trim();
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m){
    const d = new Date(+m[1], +m[2]-1, +m[3]);
    if(!isNaN(d)) return d;
  }
  m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})/);
  if(m){
    let [,dd,mo,yy] = m;
    if(yy.length===2) yy = '20'+yy;
    const d = new Date(+yy, +mo-1, +dd);
    if(!isNaN(d)) return d;
  }
  const d = new Date(s);
  if(!isNaN(d)) return d;
  return null;
}

function parseHora(str){
  if(!str) return null;
  const s = String(str).trim();
  const m = s.match(/^(\d{1,2}):(\d{2})(?::\d{2})?\s*(a\.?m\.?|p\.?m\.?)?$/i);
  if(!m) return null;
  let h = +m[1], mi = +m[2];
  const ap = (m[3]||'').toLowerCase().replace(/\./g,'');
  if(ap === 'pm' && h < 12) h += 12;
  if(ap === 'am' && h === 12) h = 0;
  if(h>23 || mi>59) return null;
  return { h, m: mi };
}

function formatFechaHoraCorta(m){
  const d = parseFecha(m.fecha);
  if(!d) return '';
  const fechaCorta = `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}`;
  const t = parseHora(m.hora);
  if(!t) return fechaCorta;
  let h12 = t.h % 12; if(h12===0) h12=12;
  const ap = t.h < 12 ? 'am' : 'pm';
  return `${fechaCorta} - ${h12}:${String(t.m).padStart(2,'0')} ${ap}`;
}

function startOfToday(){
  const d = new Date();
  return new Date(d.getFullYear(), d.getMonth(), d.getDate());
}

function matchEndTime(m){
  const d = parseFecha(m.fecha);
  if(!d) return null;
  const end = new Date(d);
  const t = parseHora(m.hora);
  if(t){
    end.setHours(t.h, t.m, 0, 0);
    end.setMinutes(end.getMinutes() + DURACION_PARTIDO_MIN);
  }else{
    end.setHours(23,59,59,999);
  }
  return end;
}

function isPastMatch(m){
  const end = matchEndTime(m);
  if(!end) return false;
  return new Date() > end;
}

function isOldMatch(m){
  const d = parseFecha(m.fecha);
  if(!d) return false;
  const cutoff = startOfToday();
  cutoff.setDate(cutoff.getDate() - DIAS_VISIBLE_PASADO);
  return d < cutoff;
}

function resultKind(str){
  const s = norm(str);
  if(!s) return 'pending';
  if(/(gan|win|acert|✔|✅|w\b)/.test(s)) return 'win';
  if(/(perd|lost|fall|✘|❌|l\b)/.test(s)) return 'loss';
  return 'pending';
}

function resultLabel(kind){
  return kind === 'win' ? 'Ganada' : kind === 'loss' ? 'Perdida' : 'Pendiente';
}

function resultIcon(kind){
  if(kind === 'win') return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
  if(kind === 'loss') return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 16 14"/></svg>';
}

function confScore(raw){
  const s = norm(raw);
  const num = parseFloat(raw);
  if(!isNaN(num) && !/[a-z]/.test(s)) return num <= 5 ? num*20 : num;
  if(/alta|high/.test(s)) return 90;
  if(/baja|low/.test(s)) return 20;
  return 55;
}

// Texto + color del porcentaje de cada tarjeta de pick: rojo 1-49, amarillo 50-74, verde lima 75-100.
function marketPct(raw){
  const s = norm(raw);
  const num = parseFloat(raw);
  if(!isNaN(num) && !/[a-z]/.test(s)){
    let pct = num <= 5 ? Math.round(num*20) : Math.round(num);
    pct = Math.max(0, Math.min(100, pct));
    const color = pct >= 75 ? 'var(--accent)' : pct >= 50 ? 'var(--pending)' : 'var(--loss-soft)';
    return { text: pct+'%', color };
  }
  if(/alta|high/.test(s)) return { text: raw||'Alta', color:'var(--accent)' };
  if(/baja|low/.test(s)) return { text: raw||'Baja', color:'var(--loss-soft)' };
  return { text: raw||'Media', color:'var(--pending)' };
}

// Clasifica cada pick en una de las 4 categorías de "Aciertos".
function pickCategory(row){
  if(row.tipo){
    const t = norm(row.tipo);
    if(/ambos/.test(t)) return 'Ambos anotan';
    if(/esquina|corner/.test(t)) return 'Tiros de esquina';
    if(/gol/.test(t)) return 'Goles totales';
    if(/gana|ganador|resultado|1x2/.test(t)) return 'Ganador';
  }
  const s = norm(row.pick);
  if(/ambos anotan|ambos marcan|btts/.test(s)) return 'Ambos anotan';
  if(/esquina|corner|c[oó]rner/.test(s)) return 'Tiros de esquina';
  if(/gol(es)?|over|under|m[aá]s de \d|menos de \d/.test(s)) return 'Goles totales';
  return 'Ganador';
}

// Color de respaldo (determinístico, no aleatorio) mientras se resuelve el color real.
function hashColor(str){
  const s = str || '?';
  let hash = 0;
  for(let i=0;i<s.length;i++){ hash = s.charCodeAt(i) + ((hash<<5)-hash); }
  const hue = Math.abs(hash) % 360;
  return `hsl(${hue}, 45%, 45%)`;
}

function normalizeHex(v){
  if(!v) return null;
  let s = String(v).trim();
  if(!s) return null;
  if(!s.startsWith('#')) s = '#'+s;
  return /^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(s) ? s : null;
}

// El color de cada equipo se extrae AUTOMÁTICAMENTE del link del logo
// (columnas "Logo Local" / "Logo Visitante"). La imagen se pide a través
// de un proxy público (wsrv.nl) porque muchos servidores bloquean la
// lectura de píxeles por seguridad (CORS), y se saca el color que más se
// repite (no un promedio simple, que da colores turbios). Si llenas
// manualmente "Color Local" / "Color Visitante" con un hex, eso manda.
const teamColorCache = new Map();

function proxiedLogoUrl(url){
  return `https://wsrv.nl/?url=${encodeURIComponent(url)}&w=48&h=48&fit=cover&output=png`;
}

function dominantColor(data){
  const buckets = new Map();
  for(let i=0;i<data.length;i+=4){
    if(data[i+3] < 120) continue;
    const r=data[i], g=data[i+1], b=data[i+2];
    const max=Math.max(r,g,b), min=Math.min(r,g,b);
    const sat = max===0 ? 0 : (max-min)/max;
    if(max > 235 && sat < 0.12) continue;
    if(max < 25) continue;
    const key = Math.round(r/24)+','+Math.round(g/24)+','+Math.round(b/24);
    const e = buckets.get(key) || { r:0, g:0, b:0, n:0 };
    e.r+=r; e.g+=g; e.b+=b; e.n++;
    buckets.set(key, e);
  }
  let best = null;
  buckets.forEach(e=>{ if(!best || e.n > best.n) best = e; });
  if(!best) return null;
  return `rgb(${Math.round(best.r/best.n)}, ${Math.round(best.g/best.n)}, ${Math.round(best.b/best.n)})`;
}

function getTeamColor(name, logo){
  const key = logo || `name:${name}`;
  if(teamColorCache.has(key)) return teamColorCache.get(key);
  const fallback = hashColor(name);
  if(!logo){
    const p = Promise.resolve(fallback);
    teamColorCache.set(key, p);
    return p;
  }
  const p = new Promise(resolve=>{
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = ()=>{
      try{
        const size = 48;
        const canvas = document.createElement('canvas');
        canvas.width = size; canvas.height = size;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, size, size);
        const data = ctx.getImageData(0, 0, size, size).data;
        resolve(dominantColor(data) || fallback);
      }catch(e){
        resolve(fallback);
      }
    };
    img.onerror = ()=> resolve(fallback);
    img.src = proxiedLogoUrl(logo);
  });
  teamColorCache.set(key, p);
  return p;
}

async function resolveMatchColors(m){
  const [cLocal, cVisit] = await Promise.all([
    normalizeHex(m.colorLocal) ? Promise.resolve(normalizeHex(m.colorLocal)) : getTeamColor(m.local, m.logoLocal),
    normalizeHex(m.colorVisitante) ? Promise.resolve(normalizeHex(m.colorVisitante)) : getTeamColor(m.visitante, m.logoVisitante)
  ]);
  return { cLocal, cVisit };
}

async function applyMatchColors(container, m){
  if(!container) return;
  const { cLocal, cVisit } = await resolveMatchColors(m);
  if(!container.isConnected) return;
  container.querySelectorAll('[data-role="local"]').forEach(el=> el.style.background = cLocal);
  container.querySelectorAll('[data-role="visit"]').forEach(el=> el.style.background = cVisit);
}

// Título con la marca de PICK!T: reemplaza la primera "I" por un "!" verde lima.
function bangify(text, color){
  const i = (text||'').indexOf('I');
  if(i === -1) return `<span>${text}</span>`;
  return `${text.slice(0,i)}<span class="bang" style="color:${color||'var(--accent)'}">!</span>${text.slice(i+1)}`;
}

function sectionHeadingHtml(text){
  return `<h2 class="section-heading">${bangify(text)}</h2>`;
}

function ligaHeadingHtml(liga){
  const raw = liga || '';
  const isF = /\(f\)|femenil/i.test(raw);
  const base = raw.replace(/\(f\)/ig,'').replace(/femenil/ig,'').trim().toUpperCase();
  const isLaLiga = /LA\s*LIGA/.test(stripAccents(base));
  const color = isLaLiga ? 'var(--la-liga-red)' : '#FFFFFF';
  const bangColor = isLaLiga ? 'var(--la-liga-red)' : undefined;
  let html = `<h2 class="section-heading" style="color:${color}">${bangify(base, bangColor)}</h2>`;
  if(isF) html += `<div class="section-subheading">Femenil</div>`;
  return html;
}

function renderHero(rows){
  // Arranca con el conteo histórico guardado en el HTML y le suma la hoja.
  let win = BASE_RECORD.ganadas || 0;
  let loss = BASE_RECORD.perdidas || 0;
  rows.forEach(r=>{
    const k = resultKind(r.resultado);
    if(k==='win') win++; else if(k==='loss') loss++;
  });
  const decided = win+loss;
  const pct = decided ? Math.round((win/decided)*100)+'%' : '—';
  heroStats[0].querySelector('.stat-num').textContent = pct;
  heroStats[1].querySelector('.stat-num').textContent = decided ? `${win}-${loss}` : '—';
}

function buildMatches(rows){
  const map = {}; const order = [];
  rows.forEach(r=>{
    const key = `${r.liga}|${r.fecha}|${r.local}|${r.visitante}`;
    if(!map[key]){
      map[key] = { liga:r.liga||'Sin liga', logoLiga:r.logoLiga, fecha:r.fecha, hora:r.hora, local:r.local, logoLocal:r.logoLocal, colorLocal:r.colorLocal, visitante:r.visitante, logoVisitante:r.logoVisitante, colorVisitante:r.colorVisitante, picks: [] };
      order.push(key);
    }
    map[key].picks.push(r);
  });
  const matches = order.map(k=>map[k]);
  matches.sort((a,b)=>{
    const da = parseFecha(a.fecha), db = parseFecha(b.fecha);
    if(da && db) return da-db;
    return 0;
  });
  return matches;
}

function uniqueLigas(matches){
  const seen = new Set(); const out = [];
  matches.forEach(m=>{
    if(!seen.has(m.liga)){ seen.add(m.liga); out.push({ name:m.liga }); }
  });
  return out;
}

function renderTabs(ligas){
  tabsEl.innerHTML = '';
  const make = (label, value, extraClass)=>{
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'tab' + (value === currentFilter ? ' active' : '') + (extraClass ? ' '+extraClass : '');
    b.textContent = label;
    b.addEventListener('click', ()=>{
      currentFilter = value;
      tabsEl.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
      b.classList.add('active');
      renderBody();
    });
    tabsEl.appendChild(b);
  };
  make('Todo', 'TODO');
  ligas.forEach(l=> make(l.name, l.name));
  make('Pasados', 'PASADOS', 'tab-divider');
  make('Aciertos', 'ACIERTOS');
}

// Dot(s) de color junto a cada tarjeta de pick: un solo color si el pick
// menciona a un equipo en particular, o los dos colores superpuestos si
// es un mercado "neutral" (goles totales, corners, ambos anotan...).
function marketDotHtml(m, pickText){
  const s = stripAccents(norm(pickText));
  const ln = stripAccents(norm(m.local));
  const vn = stripAccents(norm(m.visitante));
  const mL = ln && s.includes(ln);
  const mV = vn && s.includes(vn);
  const placeholderL = hashColor(m.local);
  const placeholderV = hashColor(m.visitante);
  if(mL && !mV) return `<span class="market-dot" data-role="local" style="background:${placeholderL}"></span>`;
  if(mV && !mL) return `<span class="market-dot" data-role="visit" style="background:${placeholderV}"></span>`;
  return `<span class="market-dot-pair"><span data-role="local" style="background:${placeholderL}"></span><span data-role="visit" style="background:${placeholderV}"></span></span>`;
}

function renderMarketCard(m, pick, isFeatured){
  const mp = marketPct(pick.confianza);
  const kind = resultKind(pick.resultado);
  return `
    <div class="market-card ${isFeatured?'featured':''}">
      <div class="market-top">
        ${marketDotHtml(m, pick.pick)}
        <span class="market-title">${pick.pick || 'Sin pick'}</span>
      </div>
      <div class="market-meta">
        <span class="market-pct" style="color:${mp.color}">${mp.text}</span>
        <span class="market-result ${kind}" title="${resultLabel(kind)}" aria-label="${resultLabel(kind)}">${resultIcon(kind)}</span>
      </div>
    </div>
  `;
}

function renderMatchSection(m){
  let bestIdx = 0, bestScore = -1;
  m.picks.forEach((p,i)=>{ const sc = confScore(p.confianza); if(sc > bestScore){ bestScore = sc; bestIdx = i; } });
  const cardsHtml = m.picks.map((p,i)=> renderMarketCard(m, p, i===bestIdx)).join('');
  const fechaHora = formatFechaHoraCorta(m);
  return `
    <div class="match-section">
      <div class="match-head-line">
        <span>${m.local||'—'} vs ${m.visitante||'—'}</span>
        ${fechaHora ? `<span class="match-head-date">${fechaHora}</span>` : ''}
      </div>
      <div class="match-head-liga">${m.liga||''}</div>
      <div class="market-row">${cardsHtml}</div>
    </div>
  `;
}

function renderMatchesList(list, emptyMsg){
  const wrap = document.getElementById('matchesWrap');
  if(!wrap) return;
  if(!list.length){
    wrap.innerHTML = `<div class="empty">${emptyMsg}</div>`;
    return;
  }
  wrap.innerHTML = list.map(m=> renderMatchSection(m)).join('');
  const sections = wrap.querySelectorAll('.match-section');
  list.forEach((m,i)=>{ if(sections[i]) applyMatchColors(sections[i], m); });
}

function computeBestPick(matches){
  let best = null;
  matches.forEach(m=> m.picks.forEach(p=>{
    const sc = confScore(p.confianza);
    if(!best || sc > best.score) best = { m, p, score: sc };
  }));
  return best;
}

function pickOfDayHtml(best){
  if(!best) return '';
  const mp = marketPct(best.p.confianza);
  return `
    <div class="pick-of-day" id="pickOfDay">
      <div class="pod-liga">${best.m.liga||''}</div>
      <div class="pod-teams">
        <span class="market-dot" data-role="local" style="background:${hashColor(best.m.local)}"></span>
        <span>${best.m.local||'—'} vs ${best.m.visitante||'—'}</span>
        <span class="market-dot" data-role="visit" style="background:${hashColor(best.m.visitante)}"></span>
      </div>
      <div class="pod-featured">
        <span class="pod-pick-text">${best.p.pick||''}</span>
        <span class="pod-pct" style="color:${mp.color}">${mp.text}</span>
      </div>
      <button type="button" class="cta-btn" id="verMasBtn">Ver más picks</button>
    </div>
  `;
}

function computeAciertos(rows){
  const cats = ['Ganador','Goles totales','Tiros de esquina','Ambos anotan'];
  const stats = {};
  // Arranca con el conteo histórico guardado en el HTML, por categoría.
  cats.forEach(c=>{
    const base = BASE_ACIERTOS[c] || {};
    stats[c] = { win: base.ganadas || 0, loss: base.perdidas || 0 };
  });
  rows.forEach(r=>{
    const kind = resultKind(r.resultado);
    if(kind === 'pending') return;
    const cat = pickCategory(r);
    if(kind === 'win') stats[cat].win++; else stats[cat].loss++;
  });
  return cats.map(c=>{
    const { win, loss } = stats[c];
    const total = win+loss;
    const pct = total ? Math.round((win/total)*100) : null;
    return { label:c, win, loss, total, pct };
  });
}

function renderAciertosHtml(rows){
  const data = computeAciertos(rows);
  const rowsHtml = data.map(d=>`
    <div class="acierto-row">
      <div class="acierto-top">
        <span class="acierto-label">${d.label}</span>
        <span class="acierto-pct">${d.pct===null ? 'Sin datos' : d.pct+'%'}</span>
      </div>
      <div class="acierto-track"><div class="acierto-fill" style="width:${d.pct||0}%"></div></div>
      <div class="acierto-count">${d.total ? `${d.win}-${d.loss} decididos` : 'Aún sin picks decididos en esta categoría'}</div>
    </div>
  `).join('');
  return `<div class="aciertos-panel">${rowsHtml}</div>`;
}

function renderBody(){
  if(currentFilter === 'ACIERTOS'){
    contentEl.innerHTML = sectionHeadingHtml('ACIERTOS') + renderAciertosHtml(lastRows);
    return;
  }

  if(currentFilter === 'PASADOS'){
    const past = lastMatches.filter(m=> isPastMatch(m) && !isOldMatch(m));
    past.sort((a,b)=>{
      const da = parseFecha(a.fecha), db = parseFecha(b.fecha);
      if(da && db) return db-da;
      return 0;
    });
    contentEl.innerHTML = sectionHeadingHtml('PASADOS') + `<div id="matchesWrap"></div>`;
    renderMatchesList(past, 'Aún no hay partidos pasados recientes.');
    return;
  }

  const upcoming = lastMatches.filter(m=> !isPastMatch(m));

  if(currentFilter === 'TODO'){
    const best = computeBestPick(upcoming);
    contentEl.innerHTML = `
      ${sectionHeadingHtml('PICKS DEL DÍA')}
      ${pickOfDayHtml(best)}
      <div id="matchesWrap"></div>
    `;
    if(best){
      const podEl = document.getElementById('pickOfDay');
      applyMatchColors(podEl, best.m);
      const verMas = document.getElementById('verMasBtn');
      if(verMas) verMas.addEventListener('click', ()=>{
        document.getElementById('matchesWrap')?.scrollIntoView({behavior:'smooth', block:'start'});
      });
    }
    renderMatchesList(upcoming, 'No hay picks todavía.');
    return;
  }

  // Una liga específica
  const filtered = upcoming.filter(m=>m.liga === currentFilter);
  contentEl.innerHTML = `${ligaHeadingHtml(currentFilter)}<div id="matchesWrap"></div>`;
  renderMatchesList(filtered, 'No hay picks para esta liga todavía.');
}

function showEmpty(){
  tabsEl.innerHTML = '';
  contentEl.innerHTML = `<div class="empty">Aún no hay picks en tu hoja. Agrega filas a la pestaña ${SHEET_TAB} y refresca.</div>`;
}

function showError(msg){
  contentEl.innerHTML = `
    <div class="status-card error">
      No pudimos cargar tus picks.<br>${msg}
      <br>Revisa que tu hoja esté publicada como CSV (Archivo → Compartir → Publicar en la web → pestaña ${SHEET_TAB} → CSV) y que el enlace en el código coincida.
      <code>${CSV_URL}</code>
      <button id="retryBtn">Reintentar</button>
    </div>`;
  document.getElementById('retryBtn').addEventListener('click', load);
}

async function load(){
  try{
    const res = await fetch(`${CSV_URL}&_=${Date.now()}`, { cache: 'no-store' });
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    const text = await res.text();
    const parsed = Papa.parse(text, { header:true, skipEmptyLines:true });
    const rows = parsed.data.map(mapRow).filter(r=>r.local || r.visitante);
    if(!rows.length){ showEmpty(); return; }

    lastRows = rows;
    renderHero(rows);

    const matches = buildMatches(rows);
    lastMatches = matches;

    const upcoming = matches.filter(m=> !isPastMatch(m));
    const ligas = uniqueLigas(upcoming);
    const especiales = ['TODO','PASADOS','ACIERTOS'];
    if(!especiales.includes(currentFilter) && !ligas.some(l=>l.name === currentFilter)){
      currentFilter = 'TODO';
    }
    renderTabs(ligas);
    renderBody();
  }catch(err){
    showError(err.message || 'Error desconocido');
  }
}

load();
setInterval(load, REFRESH_MS);
</script>
</body>
</html>
